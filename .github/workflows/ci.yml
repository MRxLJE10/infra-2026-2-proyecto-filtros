
name: CI Motor

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: Compilar y ejecutar pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Limpiar compilaciones anteriores
        run: make -C motor clean

      - name: Compilar con advertencias
        run: |
          make -C motor all \
            CXX=g++ \
            CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -fopenmp"

      - name: Ejecutar pruebas
        run: |
          make -C motor pruebas \
            CXX=g++ \
            CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -fopenmp"
